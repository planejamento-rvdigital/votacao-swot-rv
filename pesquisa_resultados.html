<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resultados da pesquisa — RV Digital 2027</title>
<meta name="description" content="Resultados da pesquisa de satisfação (restrito aos administradores).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<style>

:root{
  --navy-dk:#0b2350; --navy:#0d2d5b; --navy-lt:#14548c;
  --ink:#0d2d5b; --ink-soft:#5c6c80; --paper:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6;
  --line:#dce2ea;
  --accent:#14548c; --accent-soft:#e4edf6;
  --gold:#f5a100; --yellow:#fde90e; --green:#00b554; --red:#d14343;
  --radius:14px;
  --shadow:0 1px 2px rgba(13,45,91,.06), 0 10px 30px -12px rgba(13,45,91,.16);
  /* Text-safe link/accent color: used wherever navy-lt sits ON TOP OF a themed
     background (links, chip text, hover states, notes). Kept separate from
     --navy-lt itself because --navy-lt also doubles as a GRADIENT/background
     color (header.hero) where lightening it would wreck the white text that
     sits over it in dark mode. */
  --link:#14548c;
  /* Fixed (non-themed) neutral button background: used only where a white
     label sits on top of what would otherwise be --ink-soft. --ink-soft
     deliberately brightens in dark mode (for readability as TEXT), which
     would ruin white-on-ink-soft contrast if reused as a background. */
  --muted-btn:#5c6c80;
  /* Tag / pill / badge color families (origin chips, status flashes, admin
     banners). Each is a self-contained fg+bg(+border) triple so it is legible
     on its own in both themes; dark mode gets a darker bg + lighter fg. */
  --tag-telecom-fg:#8a5a00; --tag-telecom-bg:#fdf0dc; --tag-telecom-border:#e3c07a;
  --tag-ambos-fg:#5b3fa0; --tag-ambos-bg:#efeaf9; --tag-ambos-border:#c9bce8;
  --tag-naotelecom-fg:#0d6b4a; --tag-naotelecom-bg:#e2f7ee; --tag-naotelecom-border:#9fd9c4;
  --status-ok-fg:#0d6b3a; --status-ok-bg:#e2f8ea; --status-ok-border:#b6e8ca;
  --status-err-fg:#9c2222; --status-err-bg:#fbe6e6; --status-err-border:#f0bcbc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9edf5; --ink-soft:#9aa8bd; --paper:#0c1220; --surface:#141b2b; --surface-2:#1a2336;
    --line:#28324a; --accent-soft:#1c2740;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --link:#5b9fd6;
    --tag-telecom-fg:#f0c674; --tag-telecom-bg:#3a2f10; --tag-telecom-border:#6b5420;
    --tag-ambos-fg:#c9b3f0; --tag-ambos-bg:#2a2140; --tag-ambos-border:#4a3a70;
    --tag-naotelecom-fg:#7fe0ac; --tag-naotelecom-bg:#122a22; --tag-naotelecom-border:#1f4a38;
    --status-ok-fg:#7fe0ac; --status-ok-bg:#122a22; --status-ok-border:#1f4a38;
    --status-err-fg:#f29b9b; --status-err-bg:#3a1515; --status-err-border:#6b2a2a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Ubuntu",system-ui,sans-serif; font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"Ubuntu Mono",monospace;}
h1,h2,h3{font-family:"Ubuntu",sans-serif; font-weight:700; margin:0;}
a{color:var(--link)}

.rv-logo{flex:none; display:block;}
.rv-logo img{display:block; width:100%; height:100%; object-fit:contain;}

header.hero{
  background:linear-gradient(115deg, var(--navy-dk) 0%, var(--navy) 45%, var(--navy-lt) 100%);
  color:#fff; padding:20px 0 40px; position:relative; overflow:hidden;
}
header.hero::after{
  content:""; position:absolute; left:-40px; bottom:-60px; width:180px; height:220px;
  border:2px solid var(--yellow); border-radius:20px; opacity:.55;
}
.hero-inner{max-width:900px; margin:0 auto; padding:0 20px; display:flex; align-items:flex-start; gap:18px; position:relative; z-index:2;}
.hero-text{flex:1;}
.back-to-menu{
  position:fixed; top:14px; left:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  color:#fff; background:var(--navy-dk); border:1px solid rgba(255,255,255,.25);
  border-radius:999px; padding:8px 15px 8px 13px; font-size:13px; font-weight:600;
  text-decoration:none; transition:.15s; box-shadow:0 2px 10px -2px rgba(0,0,0,.4);
}
.back-to-menu:hover{background:var(--navy);}
.hero-text{padding-top:40px;}
@media (max-width:600px){ .back-to-menu{ padding:7px 12px 7px 11px; font-size:12.5px; } }
.hero-eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:#ffe27a; margin-bottom:10px; margin-top:2px; font-weight:700;}
.hero-title{font-size:29px; line-height:1.2;}
.hero-sub{font-size:15.5px; color:#f2f6fc; margin-top:10px; max-width:560px; line-height:1.5;}
.hero-logo{width:60px; height:60px;}

.top-tabs{display:flex; gap:6px; margin-top:18px; flex-wrap:wrap;}
.tab-btn{
  border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff;
  padding:8px 14px; border-radius:999px; font-size:13.5px; font-weight:500; cursor:pointer;
  transition:.15s;
}
.tab-btn.active{background:#fff; color:var(--navy); border-color:#fff; font-weight:700;}
.tab-btn:not(.active):hover{border-color:#fff;}
.stage-tabs{margin-top:14px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,.22);}
.stage-tabs .tab-btn{font-size:14px; padding:9px 16px;}

main{max-width:900px; margin:0 auto; padding:26px 20px 90px;}
.view{display:none;}
.view.active{display:block;}

.intro{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; box-shadow:var(--shadow); margin-bottom:20px;
}
.scale{display:grid; gap:8px; margin-top:10px;}
.scale-row{
  display:flex; gap:12px; align-items:flex-start; padding:10px 12px;
  border-radius:10px; background:var(--surface-2); border:1px solid var(--line);
}
.scale-num{
  font-family:"Ubuntu Mono",monospace; font-weight:700; font-size:15px;
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; flex:none;
}
.scale-row.s5 .scale-num{background:var(--green);}
.scale-row.s3 .scale-num{background:var(--gold);}
.scale-row.s1 .scale-num{background:var(--red);}
.scale-row p{margin:0; font-size:15px;}
.anon-note{
  margin-top:14px; font-size:14px; color:var(--ink-soft);
  padding:10px 14px; background:var(--accent-soft); border-radius:10px; line-height:1.5;
}
.anon-note .ic{margin-right:6px;}
.already-voted-note{
  margin-top:14px; font-size:13.5px; color:var(--link);
  padding:10px 14px; background:var(--accent-soft); border:1px solid var(--line); border-radius:10px; line-height:1.5;
}
.tag-legend{
  margin-top:14px; font-size:13.5px; color:var(--ink-soft); line-height:1.7;
  padding:10px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
}
.tag-legend .leg-row{display:flex; align-items:center; gap:8px; margin:3px 0;}
.tag-legend .chip{flex:none;}

.progress-wrap{ position:sticky; top:0; z-index:30; background:var(--paper); padding:10px 0 14px 185px; }
@media (max-width:600px){ .progress-wrap{ padding-left:150px; } }

.origin-filter{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:0 0 16px; }
.origin-filter-label{ font-size:13px; color:var(--ink-soft); font-weight:600; margin-right:2px; }
.origin-filter button{ border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; transition:.12s; }
.origin-filter button:hover{ border-color:var(--accent); }
.origin-filter button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.origin-filter button .cnt{ opacity:.75; font-weight:500; margin-left:3px; }
.progress-track{ height:8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
.progress-fill{height:100%; background:var(--accent); width:0%; transition:width .25s;}
.progress-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-top:6px;}

.item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow); }
.item.voted{border-color:var(--accent);}
.item.is-migrated{border-style:dashed;}
.item-top{display:flex; gap:10px; align-items:flex-start;}
.item-idx .mv{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
.item-idx .mv button{font:inherit; font-size:10px; line-height:1; padding:3px 0; width:24px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--link); cursor:pointer;}
.item-idx .mv button:disabled{opacity:.3; cursor:default;}
.item-idx .mv button:not(:disabled):hover{background:var(--accent-soft);}
.item-idx{ font-family:"Ubuntu Mono",monospace; font-size:12.5px; color:var(--ink-soft); flex:none; padding-top:2px; width:30px; }
.item-title{font-size:16.5px; font-weight:500; flex:1;}
.item-meta{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0 40px;}
.item-desc{margin:10px 0 0 40px; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.desc-flag{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; margin-right:6px; border-radius:999px; background:var(--accent-soft); color:var(--link); border:1px solid var(--line); vertical-align:1px;}
.edit-item .edit-desc-label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px;}
.edit-item .edit-desc-input{width:100%; box-sizing:border-box; font:inherit; font-size:13.5px; line-height:1.5; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); resize:vertical;}
.item-objetivo{margin:8px 0 0 40px; font-size:12.5px; color:var(--link); line-height:1.5;}
.item-objetivo b{color:var(--ink-soft);}
.item-objetivo .desc-edit-btn{margin-left:8px; vertical-align:1px;}
.obj-picker{margin:8px 0 0 40px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface);}
.obj-picker h4{margin:10px 0 4px; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);}
.obj-picker h4:first-child{margin-top:0;}
.obj-opt{display:flex; gap:8px; align-items:baseline; width:100%; text-align:left; font:inherit; font-size:13px; color:var(--ink); background:none; border:1px solid transparent; border-radius:8px; padding:5px 8px; cursor:pointer;}
.obj-opt:hover{background:var(--accent-soft);}
.obj-opt.cur{border-color:var(--link); background:var(--accent-soft); font-weight:600;}
.obj-opt .oc{font-size:10.5px; font-weight:700; color:var(--link); flex:none; min-width:22px;}
.title-edit{display:flex; flex-direction:column; gap:6px; width:100%;}
.title-edit input{width:100%; box-sizing:border-box; font:inherit; font-size:15px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink);}
.item-title .desc-edit-btn{margin-left:8px; vertical-align:2px;}
.unif-row{margin:8px 0 0 40px;}
.unif-row details.orig{display:inline-block; margin:0;}
.unif-warn{margin:8px 0; padding:6px 10px; font-size:12px; color:#8a5a00; background:#fdf0dc; border-radius:8px;}
.obj-opt .ud{font-size:11px; color:var(--ink-soft); font-weight:400; margin-left:6px;}
.obj-opt[disabled]{opacity:.7; cursor:default;}
.obj-actions{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
.obj-actions button{font:inherit; font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
.chip{ font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); background:var(--surface-2); font-weight:500; }
.chip.type-c{color:var(--link); border-color:var(--link); background:var(--accent-soft);}
.chip.origin-telecom, .chip.tag-telecom{color:var(--tag-telecom-fg); border-color:var(--tag-telecom-border); background:var(--tag-telecom-bg);}
.chip.origin-ambos, .chip.tag-ambos{color:var(--tag-ambos-fg); border-color:var(--tag-ambos-border); background:var(--tag-ambos-bg);}
.chip.origin-naotelecom, .chip.tag-naotelecom{color:var(--tag-naotelecom-fg); border-color:var(--tag-naotelecom-border); background:var(--tag-naotelecom-bg);}
.chip.tag-telecomambos{color:var(--link); border-color:var(--line); background:var(--accent-soft);}
.chip.migrated-chip{color:var(--tag-ambos-fg); border-color:var(--tag-ambos-border); background:var(--tag-ambos-bg); font-weight:700;}
details.orig{margin:8px 0 0 40px;}
details.orig summary{font-size:12.5px; color:var(--link); cursor:pointer; list-style:none; font-weight:500;}
details.orig summary::-webkit-details-marker{display:none;}
details.orig ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--ink-soft);}
details.orig ol li{margin-bottom:4px;}
details.orig .oi-origin{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:999px; margin-left:6px; white-space:nowrap;}
details.orig .oi-origin.t{color:var(--tag-telecom-fg); background:var(--tag-telecom-bg);}
details.orig .oi-origin.a{color:var(--tag-ambos-fg); background:var(--tag-ambos-bg);}
details.orig .oi-origin.nt{color:var(--tag-naotelecom-fg); background:var(--tag-naotelecom-bg);}
details.orig .reason{margin-top:6px; font-size:12.5px; color:var(--ink-soft); font-style:italic;}
.desc-wrap{margin:8px 0 0 40px;}
.desc-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.desc-toggle{background:none; border:0; padding:0; font:inherit; font-size:12.5px; font-weight:500; color:var(--link); cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
.desc-toggle .dt-ar{display:inline-block; transition:transform .15s; font-size:11px;}
.desc-wrap.collapsed .desc-toggle .dt-ar{transform:rotate(-90deg);}
.desc-edit-btn{font:inherit; font-size:12px; font-weight:600; color:var(--link); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 10px; cursor:pointer;}
.desc-edit-btn:hover{background:var(--accent-soft);}
.desc-wrap .item-desc{margin:6px 0 0 0;}
.desc-wrap.collapsed .item-desc{display:none;}
.desc-form textarea{width:100%; box-sizing:border-box; margin-top:6px; font:inherit; font-size:13.5px; line-height:1.5; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); resize:vertical;}
.desc-form .desc-actions{display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap;}
.desc-form .desc-actions button{font:inherit; font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
.desc-form .desc-actions button.primary{background:var(--link); color:#fff; border-color:var(--link);}
.desc-form .desc-status{font-size:12px; color:var(--ink-soft);}
.desc-form .desc-status.err{color:#b42318;}
.admin-note{margin:0 0 14px; padding:8px 12px; font-size:12.5px; color:var(--ink-soft); background:var(--accent-soft); border:1px solid var(--line); border-radius:10px;}
details.swot-rel{margin:6px 0 0 40px;}
details.swot-rel summary{font-size:12.5px; color:var(--link); cursor:pointer; list-style:none; font-weight:500;}
details.swot-rel summary::-webkit-details-marker{display:none;}
details.swot-rel ul{list-style:none; margin:8px 0 0; padding:0; font-size:13px; color:var(--ink-soft);}
details.swot-rel li{margin-bottom:5px; display:flex; gap:8px; align-items:baseline;}
details.swot-rel .rel-q{font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; white-space:nowrap; flex:none;}
details.swot-rel .rel-note{margin-top:6px; font-size:12px; font-style:italic; color:var(--ink-soft);}

.migrated-heading{ margin:26px 0 12px; font-size:14px; font-weight:700; color:var(--ink-soft); padding-top:14px; border-top:1px dashed var(--line); }


/* Matriz esforço x impacto (trilha Projetos) */
.mx-help-list{margin:0 0 4px; padding-left:20px; font-size:13.5px; line-height:1.5;} .mx-help-list li{margin-bottom:4px;}
.mx-wrap{margin:14px 0 0 40px; max-width:620px;}
.mx-title{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:2px;}
.mx-sub{font-size:12px; color:var(--ink-soft); margin-bottom:8px; line-height:1.35;}
.mx-grid{display:grid; grid-template-columns:22px 1fr 1fr; gap:6px;}
.mx-ylab{grid-column:1; grid-row:1 / span 2; writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em;}
.mx-cell{border:1.5px solid var(--line); border-left-width:6px; border-radius:10px; padding:9px 11px; cursor:pointer; background:var(--surface); text-align:left; transition:.12s; font-family:inherit; color:inherit;}
.mx-cell:hover{border-color:var(--accent);}
.mx-cell .mx-name{display:block; font-weight:700; font-size:13.5px; color:var(--ink);}
.mx-cell .mx-ax{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:1px;}
.mx-cell .mx-do{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.3; font-weight:400;}
.mx-cell[data-q="qw"]{border-left-color:#00b554;} .mx-cell[data-q="gp"]{border-left-color:#14548c;}
.mx-cell[data-q="pr"]{border-left-color:#7a8699;} .mx-cell[data-q="ti"]{border-left-color:#d14343;}
.mx-cell.sel{background:var(--accent); border-color:var(--accent);}
.mx-cell.sel .mx-name,.mx-cell.sel .mx-ax,.mx-cell.sel .mx-do{color:#fff;}
.mx-xlab{grid-column:2 / span 2; display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--ink-soft);}
.mx-board{display:grid; grid-template-columns:22px 1fr 1fr; gap:8px; margin:6px 0 18px;}
.mx-box{border:1.5px solid var(--line); border-left-width:6px; border-radius:10px; padding:10px 12px; background:var(--surface); min-height:90px;}
.mx-box h4{margin:0 0 2px; font-size:14px; color:var(--ink);} .mx-box .mx-ax{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.mx-box ul{margin:8px 0 0; padding-left:18px; font-size:13px; line-height:1.4;} .mx-box li{margin-bottom:3px;} .mx-box li .mx-n{color:var(--ink-soft); font-size:11.5px; white-space:nowrap;}
.mx-box .mx-empty{font-size:12px; color:var(--ink-soft); margin-top:8px; font-style:italic;}
.mx-dist{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; font-size:12px;}
.mx-dist span{border:1px solid var(--line); border-radius:999px; padding:2px 9px; background:var(--surface);}
.mx-dist span b{font-weight:700;}
.oi-div{color:var(--ink-soft); font-size:12px;}
/* Editor de convergências (admin > Projetos) */
.cv-intro{font-size:13.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;}
.cv-warn{background:#fff6e0; border:1px solid #f0d28a; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; color:#6b4a00;}
.cv-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 16px;}
.cv-bar input[type=text]{flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px;}
.cv-btn{border:1px solid var(--line); background:var(--surface-2); color:var(--ink); padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;}
.cv-btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.cv-btn.danger{color:#b23b3b; border-color:#e6bcbc;}
.cv-btn:disabled{opacity:.5; cursor:not-allowed;}
.cv-card{border:1.5px solid var(--line); border-left:6px solid var(--navy-lt); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:var(--surface);}
.cv-card.single{border-left-color:var(--gold);}
.cv-head{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
.cv-title{font-weight:700; font-size:15px; color:var(--ink); flex:1; min-width:200px;}
.cv-badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--link); margin-left:6px; vertical-align:middle;}
.cv-badge.new{background:#e2f8ea; color:#0d6b4a;}
.cv-members{list-style:none; margin:10px 0 8px; padding:0;}
.cv-members li{display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13.5px; background:var(--surface-2);}
.cv-members li .cv-mt{flex:1;} .cv-members li .cv-md{color:var(--ink-soft); font-size:12px; white-space:nowrap;}
.cv-add{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;}
.cv-add select{border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; font-size:13px; max-width:100%; flex:1; min-width:220px;}
.cv-note{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.cv-solos h4{margin:18px 0 8px; font-size:14px;}
.cv-solo{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13.5px; background:var(--surface);}
.cv-solo .cv-mt{flex:1; min-width:200px;} .cv-solo select{border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-size:12.5px; max-width:260px;}
.cv-status{font-size:12.5px; font-weight:600; margin-left:6px;} .cv-status.err{color:#b23b3b;} .cv-status.ok{color:#0d6b4a;}
.fs-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:6px 0 14px;}
.fs-sum{display:flex; gap:8px; flex-wrap:wrap;}
.fs-pill{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-size:12.5px; color:var(--ink);}
.fs-pill i{width:10px; height:10px; border-radius:50%; background:var(--qc); display:inline-block;}
.fs-pill.tot{background:var(--surface-2); font-weight:600;}
.fs-actions{display:flex; gap:8px; flex-wrap:wrap;}
.fs-login{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 14px;}
.fs-login input{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px; min-width:200px;}
.fs-edit-note{background:var(--accent-soft); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:13px; margin-bottom:14px; color:var(--ink);}
.fs-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:760px){ .fs-grid{grid-template-columns:1fr;} }
.fs-quad{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);}
.fs-qhead{background:var(--qs); color:var(--qc); border-bottom:2px solid var(--qc); font-weight:700; font-size:15px; padding:10px 16px;}
.fs-div{font-size:12.5px; font-weight:700; color:var(--ink); padding:10px 16px 6px; border-bottom:1px solid var(--line);}
.fs-list{list-style:none; margin:0; padding:4px 16px 0; counter-reset:fs;}
.fs-item{counter-increment:fs; display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.4;}
.fs-item:last-child{border-bottom:none;}
.fs-item::before{content:counter(fs); flex:none; width:22px; height:22px; border-radius:50%; background:var(--qs); color:var(--qc); font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; margin-top:1px;}
.fs-item .fs-text{flex:1;}
.fs-edited{font-size:11px; font-weight:700; color:#8a5a00; background:#fdf0dc; border-radius:999px; padding:2px 8px; flex:none;}
.fs-edit-btn{flex:none; padding:4px 12px;}
.fs-add{display:flex; gap:8px; margin:10px 0 2px;}
.fs-add input{flex:1; min-width:0; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px;}
@media print{ .fs-add{display:none !important;} }
.fs-item.editing{flex-wrap:wrap;} .fs-add{display:flex; gap:8px; margin:10px 0 2px;}
.fs-add input{flex:1; min-width:0; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px;}
@media print{ .fs-add{display:none !important;} }
.fs-item.editing textarea{flex:1; min-width:200px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; resize:vertical;}
.fs-actions-row{flex-basis:100%; display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-left:32px;}
.fs-total{padding:10px 16px 12px; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--line); background:var(--surface-2);}
.fs-foot{font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.5;}
.sv-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow); margin:0 0 14px;}
.sv-q{font-weight:800; color:var(--navy); font-size:15.5px; margin:0 0 4px;}
.sv-q .sv-n{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; align-items:center; justify-content:center; margin-right:8px;}
.sv-hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;}
.sv-scale{display:flex; gap:8px; flex-wrap:wrap;}
.sv-opt{flex:1 1 90px; min-width:84px; border:2px solid var(--line); background:var(--surface-2); border-radius:12px; padding:10px 6px; cursor:pointer; text-align:center; font-family:inherit; color:var(--ink);}
.sv-opt b{display:block; font-size:20px; line-height:1.1;}
.sv-opt span{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.sv-opt:hover{border-color:#9db4cc;}
.sv-opt.on{background:var(--navy); border-color:var(--navy); color:#fff;}
.sv-opt.on span{color:#dbe6f2;}
.sv-card.missing{border-color:#d9534f; box-shadow:0 0 0 3px rgba(217,83,79,.15);}
.sv-card textarea, .sv-card input[type=text]{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:14px;}
.sv-card textarea{min-height:110px; resize:vertical;}
.sv-card textarea.sv-qc{min-height:64px; margin-top:12px; background:#fbfcfe;}
.sv-send{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.sv-thanks{background:#e2f7ee; border:1px solid #9fd8bd; color:#0d6b4a; border-radius:12px; padding:14px 16px; font-weight:700; margin:0 0 14px; display:none;}
.sv-res-q{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.sv-res-q:last-child{border-bottom:0;}
.sv-res-t{flex:1; font-size:14px; color:var(--ink);}
.sv-bar{flex:0 0 220px; height:12px; background:#e8edf3; border-radius:99px; overflow:hidden;}
.sv-bar i{display:block; height:100%; background:var(--green);}
.sv-avg{flex:0 0 48px; text-align:right; font-weight:800; color:var(--navy);}
.sv-dist{font-size:11.5px; color:var(--ink-soft); flex:0 0 150px;}
.sv-cm{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 8px; background:var(--surface-2); font-size:14px; white-space:pre-wrap;}
.sv-cm small{display:block; color:var(--ink-soft); margin-top:6px; font-size:12px;}
@media(max-width:640px){ .sv-res-q{flex-wrap:wrap;} .sv-bar{flex:1 1 100%;} }
@media print{ .sv-send button{display:none !important;} }
.pr-add{display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px; background:#f6f8fb; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); list-style:none;}

.pr-item.pr-no{background:#f7f8fa;}

.pr-save{font-size:12.5px; font-weight:600; margin-left:8px;} .pr-save.err{color:#b23b3b;} .pr-save.ok{color:#0d6b4a;}

@media print{ header.hero .back-to-menu, .fs-actions, .fs-login, .fs-edit-note, .fs-edit-btn{display:none !important;} .fs-quad{box-shadow:none; break-inside:avoid;} }

.vote-row{display:flex; gap:8px; margin:12px 0 0 40px; flex-wrap:wrap;}

.export-bar select.export-format{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:7px 10px; font-size:12.5px; font-family:inherit; }
.export-bar button.export-btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:700; cursor:pointer; }
.export-bar button.export-btn:hover{ border-color:var(--link); color:var(--link); }
.export-bar button.export-btn.export-total{ background:var(--navy); color:#fff; border-color:var(--navy); }
.export-bar button.export-btn.export-total:hover{ opacity:.88; color:#fff; }
.export-bar .export-status{ font-size:12px; color:var(--ink-soft); margin-left:2px; }
.export-bar .export-status.err{ color:var(--red); font-weight:600; }
.rank-arrows{display:flex; flex-direction:column; gap:2px;}
.rank-arrows button{ border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); border-radius:5px; width:20px; height:16px; font-size:10px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.rank-arrows button:disabled{opacity:.3; cursor:default;}
.rank-arrows button:not(:disabled):hover{background:var(--accent); color:#fff; border-color:var(--accent);}
.top5-table td.top5-rankcell{display:flex; align-items:center; gap:6px;}

.add-item-box{ background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; }
.add-item-box h4{font-size:13.5px; margin:0 0 8px;}
.add-item-box textarea{ width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:"Ubuntu",sans-serif; font-size:13.5px; resize:vertical; color:var(--ink); background:var(--surface); }
.add-item-box .add-row{display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap;}
.add-item-box select{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; color:var(--ink); background:var(--surface); }
.add-item-btn{ border:none; border-radius:999px; padding:8px 16px; font-weight:700; font-size:12.5px; cursor:pointer; color:#fff; background:var(--green); }
.remove-item-btn{ border:1px solid var(--status-err-border); background:var(--status-err-bg); color:var(--status-err-fg); border-radius:999px; padding:8px 16px; font-weight:600; font-size:12.5px; cursor:pointer; }
.added-badge{color:var(--green); font-weight:700;}
.migrated-badge{color:var(--tag-ambos-fg); font-weight:700;}
.removed-panel{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-top:18px; }
.removed-panel h4{font-size:13px; margin:0 0 10px; color:var(--ink-soft);}
.removed-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
.removed-row:last-child{border-bottom:none;}
.removed-row .rt{flex:1; color:var(--ink-soft);}
.restore-item-btn{ border:1px solid var(--line); background:var(--surface); color:var(--link); border-radius:999px; padding:6px 13px; font-size:12px; font-weight:600; cursor:pointer; flex:none; }
.reset-confirm{background:var(--red) !important;}

.menu-grid{ display:grid; gap:14px; margin-top:6px; }
.menu-card{
  display:flex; align-items:center; gap:16px; text-decoration:none;
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mc-accent);
  border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); transition:.15s;
  position:relative;
}
.menu-card:hover{ transform:translateX(3px); box-shadow:0 4px 16px -4px rgba(13,45,91,.22), var(--shadow); }
.menu-card.is-voted{ opacity:.68; }
.menu-card-icon{
  width:46px; height:46px; border-radius:12px; background:var(--mc-soft); color:var(--mc-accent);
  display:flex; align-items:center; justify-content:center; font-size:21px; flex:none;
}
.menu-card-body{flex:1; min-width:0;}
.menu-card-title{font-size:18.5px; font-weight:700; color:var(--ink); margin-bottom:3px; display:flex; align-items:center; gap:8px;}
.menu-card-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.4;}
.menu-card-arrow{font-size:18px; color:var(--ink-soft); flex:none; transition:.15s;}
.menu-card:hover .menu-card-arrow{color:var(--mc-accent); transform:translateX(2px);}
.voted-badge{ font-size:10.5px; font-weight:700; color:var(--status-ok-fg); background:var(--status-ok-bg); border:1px solid var(--status-ok-border); border-radius:999px; padding:2px 8px; white-space:nowrap; }
.admin-link-pill{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  color:var(--ink-soft); font-size:13px; font-weight:600; padding:10px 18px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface); transition:.15s;
}
.admin-link-pill:hover{ color:var(--link); border-color:var(--link); background:var(--surface-2); }
.index-footnote{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:14px; line-height:1.5; }

.stage-grid{ display:grid; gap:18px; margin-top:6px; grid-template-columns:1fr; }
@media (min-width:640px){ .stage-grid{ grid-template-columns:1fr 1fr; } }
.menu-sec{ margin:0 0 26px; }
.menu-sec-t{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--navy); font-weight:800; margin:0 0 2px; padding-bottom:6px; border-bottom:2px solid var(--line); }
.menu-sec-s{ font-size:13px; color:var(--ink-soft); margin:6px 0 10px; }
@media (min-width:640px){ .stage-grid.one{ grid-template-columns:1fr 1fr; } .stage-grid.one .stage-card{ grid-column:1; } }
.stage-card{
  display:block; text-decoration:none; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--mc-accent);
  border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); transition:.15s;
}
.stage-card:hover{ transform:translateY(-2px); box-shadow:0 8px 22px -8px rgba(13,45,91,.25), var(--shadow); }
.stage-card-icon{
  width:52px; height:52px; border-radius:14px; background:var(--mc-soft); color:var(--mc-accent);
  display:flex; align-items:center; justify-content:center; margin-bottom:14px;
}
.stage-card-title{font-size:20px; font-weight:700; color:var(--ink); margin-bottom:6px;}
.stage-card-desc{font-size:14px; color:var(--ink-soft); line-height:1.45;}
.stage-card-note{margin-top:12px; font-size:12.5px; color:var(--link); background:var(--accent-soft); border-radius:8px; padding:8px 10px; line-height:1.4;}
.step-back{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13.5px; font-weight:600; text-decoration:none; margin-bottom:16px; cursor:pointer; border:none; background:none; padding:0; }
.step-back:hover{color:var(--link);}
#step2-telecom, #step2-naotelecom{display:none;}

.gate{ max-width:420px; margin:60px auto; text-align:center; padding:30px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.gate .icon{font-size:34px; margin-bottom:10px;}
.gate input{ width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); margin-top:10px; font-size:14px; font-family:"Ubuntu",sans-serif; }
.gate button{ margin-top:14px; width:100%; border:none; border-radius:999px; padding:12px; font-weight:700; font-size:14.5px; cursor:pointer; color:#fff; background:var(--navy); }
.gate .err{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

.fatal-error-box{
  background:var(--status-err-bg); border:1px solid var(--status-err-border); color:var(--status-err-fg);
  border-radius:10px; padding:18px 20px; font-size:14px; line-height:1.5;
}

footer.pagefoot{ background:var(--surface); border-top:1px solid var(--line); margin-top:30px; padding:22px 20px; }
.pagefoot-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; gap:14px;}
.pagefoot-logo{width:32px; height:32px;}
.pagefoot-text{font-size:12px; color:var(--ink-soft); line-height:1.4;}

.device-id-box{ max-width:900px; margin:14px auto 0; padding-top:14px; border-top:1px solid var(--line); }
.device-id-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
.device-id-value-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.device-id-value{ font-family:"Ubuntu Mono",monospace; font-size:12.5px; letter-spacing:.03em; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; word-break:break-all; }
.device-id-copy-btn{ border:1px solid var(--line); border-radius:999px; padding:5px 14px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft); background:var(--surface); transition:.15s; flex:none; }
.device-id-copy-btn:hover{ background:var(--surface-2); }
.device-id-copy-btn.copied{ background:var(--status-ok-bg); color:var(--status-ok-fg); border-color:var(--status-ok-border); }
.device-id-help{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4; max-width:560px; }

.device-reset-box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 18px; margin-bottom:18px; box-shadow:var(--shadow); }
.device-reset-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
.device-reset-label .device-reset-sub{ font-weight:400; }
.device-reset-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.device-reset-input{ flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-family:"Ubuntu Mono",monospace; font-size:12.5px; color:var(--ink); background:var(--surface-2); }
.device-reset-btn{ border:none; border-radius:999px; padding:8px 16px; font-weight:700; font-size:12.5px; cursor:pointer; color:#fff; background:#b23b3b; flex:none; }
.device-reset-btn:disabled{ background:var(--muted-btn); cursor:default; }
.device-reset-status{ font-size:12px; font-weight:600; margin-top:8px; min-height:15px; }
.device-reset-status.ok{ color:var(--status-ok-fg); }
.device-reset-status.err{ color:var(--status-err-fg); }

@media (max-width:600px){
  .vote-row{flex-direction:column;}
  .item-meta, details.orig, .vote-row{margin-left:0;}
  .hero-title{font-size:22px;}
}

</style>
</head>

    sb = window.supabase.createClient(window.RV_SUPABASE_URL, window.RV_SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn("supabase indisponível", e); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var rows = [];
async function load(){
  var err = document.getElementById("fs-login-err");
  var r = await sb.from("survey_responses").select("answers,name,comment,updated_at").order("updated_at", { ascending:false });
  if(r.error){ err.textContent = "Não foi possível ler as respostas (" + r.error.message + "). Rode o script pesquisa_satisfacao.sql no Supabase."; return; }
  rows = r.data || []; draw();
}
function draw(){
  document.getElementById("fs-login").style.display = "none";
  document.getElementById("sr-body").style.display = "block";
  document.getElementById("sr-sum").innerHTML = '<span class="fs-pill tot">Respostas: <b>'+rows.length+'</b></span>';
  var h = "";
  QS.filter(function(q){ return q.k === "scale"; }).forEach(function(q){
    var vals = rows.map(function(x){ return x.answers && x.answers[q.id]; }).filter(function(v){ return typeof v === "number"; });
    var avg = vals.length ? vals.reduce(function(a,b){ return a+b; }, 0) / vals.length : 0;
    var dist = [1,2,3,4,5].map(function(n){ return n + ": " + vals.filter(function(v){ return v === n; }).length; }).join(" · ");
    h += '<div class="sv-res-q"><div class="sv-res-t">'+esc(q.t)+'</div><div class="sv-dist">'+dist+'</div><div class="sv-bar"><i style="width:'+(avg/5*100)+'%"></i></div><div class="sv-avg">'+(vals.length ? avg.toFixed(1).replace(".", ",") : "—")+'</div></div>';
  });
  document.getElementById("sr-scale").innerHTML = h || "—";
  var yn = { sim:0, talvez:0, nao:0 };
  rows.forEach(function(x){ var v = x.answers && x.answers.q6; if(yn[v] !== undefined) yn[v]++; });
  document.getElementById("sr-yn").innerHTML = '<span class="fs-pill tot">Sim: <b>'+yn.sim+'</b></span><span class="fs-pill tot">Talvez: <b>'+yn.talvez+'</b></span><span class="fs-pill tot">Não: <b>'+yn.nao+'</b></span>';
  var qh = "";
  QS.forEach(function(q, i){
    var lst = rows.filter(function(x){ return x.answers && x.answers[q.id + "_c"]; });
    if(!lst.length) return;
    qh += '<div class="sv-q" style="font-size:14px; margin:14px 0 6px;">'+(i+1)+'. '+esc(q.t)+'</div>' + lst.map(function(x){
      var v = x.answers[q.id], lab = (q.k === "scale") ? ("Nota " + v) : ({sim:"Sim", talvez:"Talvez", nao:"Não"}[v] || v);
      return '<div class="sv-cm">'+esc(x.answers[q.id + "_c"])+'<small>'+lab+' &middot; '+(x.name ? esc(x.name) : 'Anônimo')+' &middot; '+new Date(x.updated_at).toLocaleDateString("pt-BR")+'</small></div>';
    }).join("");
  });
  document.getElementById("sr-qcm").innerHTML = qh || '<div class="sv-hint">Nenhum comentário por pergunta até agora.</div>';
  var cm = rows.filter(function(x){ return x.comment; });
  document.getElementById("sr-cm").innerHTML = cm.length ? cm.map(function(x){
    return '<div class="sv-cm">'+esc(x.comment)+'<small>'+(x.name ? esc(x.name) : 'Anônimo')+' &middot; '+new Date(x.updated_at).toLocaleDateString("pt-BR")+'</small></div>';
  }).join("") : '<div class="sv-hint">Nenhuma sugestão enviada até agora.</div>';
}
function csv(){
  var head = ["Data"].concat(QS.map(function(q){ return q.t; })).concat(QS.map(function(q, i){ return "Comentário P" + (i+1); })).concat(["Sugestões","Nome (opcional)"]);
  var lines = [head].concat(rows.map(function(x){ return [new Date(x.updated_at).toLocaleString("pt-BR")].concat(QS.map(function(q){ return x.answers ? (x.answers[q.id] === undefined ? "" : x.answers[q.id]) : ""; })).concat(QS.map(function(q){ return (x.answers && x.answers[q.id + "_c"]) || ""; })).concat([x.comment || "", x.name || ""]); }));
  var txt = lines.map(function(l){ return l.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + txt], { type:"text/csv;charset=utf-8" })); a.download = "pesquisa_satisfacao_rv_2027.csv"; a.click();
}
document.getElementById("fs-login-go").addEventListener("click", async function(){
  var err = document.getElementById("fs-login-err"); err.textContent = "";
  if(!sb){ err.textContent = "Sem conexão com o servidor."; return; }
  var res = await sb.auth.signInWithPassword({ email: document.getElementById("fs-email").value.trim(), password: document.getElementById("fs-pass").value });
  if(res.error){ err.textContent = "E-mail ou senha incorretos."; return; }
  load();
});
document.getElementById("sr-refresh").addEventListener("click", load);
document.getElementById("sr-csv").addEventListener("click", csv);
document.getElementById("sr-print").addEventListener("click", function(){ window.print(); });
if(sb) sb.auth.getSession().then(function(r){ if(r && r.data && r.data.session) load(); }).catch(function(){});
}catch(e){ console.error("resultados pesquisa init error", e); }
</script>
</body>
</html>
